services:
  gals-api:
    build: .
    container_name: gals-middleware
    restart: unless-stopped
    pid: "host" # CLAVE: Permite que psutil lea la CPU/RAM real de la Raspberry, no la del contenedor
    environment:
      - REGISTRY_URL=${REGISTRY_URL}
      - SERVICE_KEY=${SERVICE_KEY}
      - ENVIRONMENT_ID=${ENVIRONMENT_ID}
    ports:
      # El cloudflared systemd del host (túnel raspberry-pi-5) llega por
      # localhost, no por nombre de contenedor. Sin esto, 502 Bad Gateway.
      - "8085:8085"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Le da control total sobre el motor de Docker
      - /sys:/sys:ro # Necesario para leer la temperatura